[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vector-mcp"
version = "0.1.0"
description = "VectoRise MCP server: video-to-Lottie tools for AI agents"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0",
    "vector-core",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
vectorise-mcp = "vector_mcp.__main__:main"
