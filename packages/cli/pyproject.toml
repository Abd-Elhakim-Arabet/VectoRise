[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vector-cli"
version = "0.1.0"
description = "VectoRise command line: video to vector Lottie (brain-dead pipeline)"
requires-python = ">=3.10"
dependencies = [
    "vector-core",
    "tqdm>=4",
]

[project.scripts]
vectorise = "vector_cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
