[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vector-core"
version = "0.1.0"
description = "VectoRise core engine: video to vector Lottie pipeline"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4",
    "vtracer>=0.6",
    "lottie>=0.7",
    "scenedetect>=0.6",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]
